  <text x="108" y="156" fill="#fcf7ff" font-size="42" font-family="Arial, sans-serif" font-weight="700" letter-spacing="8">GOODS FOR YOUR GOODS</text>
  <text x="108" y="214" fill="#ddceef" font-size="28" font-family="Arial, sans-serif" letter-spacing="6">MOCK STUDIO ART / LEGACY LINEUP</text>
