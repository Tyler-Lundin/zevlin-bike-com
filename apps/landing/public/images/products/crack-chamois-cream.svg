<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Crack Chamois Cream mock art</title>
  <desc id="desc">Mock studio poster for Zevlin Crack Chamois Cream.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09111b" />
      <stop offset="55%" stop-color="#12263c" />
      <stop offset="100%" stop-color="#1f446c" />
    </linearGradient>
    <linearGradient id="jar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefefe" />
      <stop offset="100%" stop-color="#d9e9f7" />
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#104f82" />
      <stop offset="100%" stop-color="#31b9f5" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d5e7f7" fill-opacity="0.18" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#02060b" flood-opacity="0.34" />
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect width="1200" height="1200" fill="url(#dots)" />
  <circle cx="950" cy="235" r="230" fill="#3cc7ff" fill-opacity="0.18" />
  <circle cx="245" cy="1010" r="290" fill="#b97a11" fill-opacity="0.12" />
  <g opacity="0.22">
    <path d="M140 905c124-78 275-115 454-115 151 0 305 28 456 85" fill="none" stroke="#f2f8ff" stroke-width="18" stroke-linecap="round" />
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="938" rx="230" ry="48" fill="#000" fill-opacity="0.28" />
    <rect x="358" y="288" width="484" height="144" rx="72" fill="#eff7ff" fill-opacity="0.9" />
    <rect x="316" y="378" width="568" height="436" rx="118" fill="url(#jar)" />
    <rect x="390" y="474" width="420" height="182" rx="90" fill="url(#label)" />
    <rect x="416" y="670" width="368" height="74" rx="37" fill="#e6f5ff" fill-opacity="0.86" />
    <text x="600" y="545" text-anchor="middle" fill="#ffffff" font-size="54" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="700" letter-spacing="10">ZEVLIN</text>
    <text x="600" y="618" text-anchor="middle" fill="#ffffff" font-size="118" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="800" letter-spacing="12">CRACK</text>
    <text x="600" y="717" text-anchor="middle" fill="#0c4169" font-size="34" font-family="Arial, sans-serif" font-weight="700" letter-spacing="6">NATURAL NON-TINGLE FORMULA</text>
    <text x="600" y="788" text-anchor="middle" fill="#eef7ff" font-size="34" font-family="Arial, sans-serif" font-weight="700" letter-spacing="8">CHAMOIS CREAM</text>
  </g>
  <text x="110" y="156" fill="#f4fbff" font-size="42" font-family="Arial, sans-serif" font-weight="700" letter-spacing="8">GOODS FOR YOUR GOODS</text>
  <text x="110" y="214" fill="#c7dbef" font-size="28" font-family="Arial, sans-serif" letter-spacing="6">MOCK STUDIO ART / LEGACY LINEUP</text>
</svg>
