<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">BYOT Towel mock art</title>
  <desc id="desc">Mock studio poster for the BYOT Towel.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1410" />
      <stop offset="58%" stop-color="#4b3112" />
      <stop offset="100%" stop-color="#8e5d10" />
    </linearGradient>
    <linearGradient id="fabricA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7dc" />
      <stop offset="100%" stop-color="#f8d782" />
    </linearGradient>
    <linearGradient id="fabricB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8ae" />
      <stop offset="100%" stop-color="#efc465" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#fff4d8" fill-opacity="0.18" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#060301" flood-opacity="0.34" />
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect width="1200" height="1200" fill="url(#dots)" />
  <circle cx="954" cy="214" r="226" fill="#f9d275" fill-opacity="0.2" />
  <circle cx="198" cy="1000" r="288" fill="#ffffff" fill-opacity="0.08" />
  <g opacity="0.24">
    <path d="M122 908c129-79 292-120 470-120 136 0 286 27 470 85" fill="none" stroke="#fff4d8" stroke-width="18" stroke-linecap="round" />
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="604" cy="954" rx="218" ry="42" fill="#000" fill-opacity="0.24" />
    <rect x="342" y="392" width="528" height="362" rx="54" fill="url(#fabricA)" transform="rotate(-8 606 573)" />
    <rect x="380" y="444" width="492" height="320" rx="48" fill="url(#fabricB)" transform="rotate(6 626 604)" />
    <rect x="430" y="522" width="354" height="148" rx="40" fill="#ffffff" fill-opacity="0.82" />
    <text x="607" y="576" text-anchor="middle" fill="#9c6812" font-size="86" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="800" letter-spacing="8">BYOT</text>
    <text x="607" y="636" text-anchor="middle" fill="#7d5108" font-size="38" font-family="Arial, sans-serif" font-weight="700" letter-spacing="7">TOWEL</text>
  </g>
  <text x="108" y="156" fill="#fff8ea" font-size="42" font-family="Arial, sans-serif" font-weight="700" letter-spacing="8">GOODS FOR YOUR GOODS</text>
  <text x="108" y="214" fill="#efddb3" font-size="28" font-family="Arial, sans-serif" letter-spacing="6">MOCK STUDIO ART / LEGACY LINEUP</text>
</svg>
