<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Super Crack Chamois Cream mock art</title>
  <desc id="desc">Mock studio poster for Zevlin Super Crack Chamois Cream.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10131a" />
      <stop offset="56%" stop-color="#2b1d18" />
      <stop offset="100%" stop-color="#5e3410" />
    </linearGradient>
    <linearGradient id="jar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#f8dfbf" />
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9b28" />
      <stop offset="100%" stop-color="#ffde8f" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#fff1db" fill-opacity="0.16" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#050201" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect width="1200" height="1200" fill="url(#dots)" />
  <circle cx="976" cy="215" r="238" fill="#ffb347" fill-opacity="0.2" />
  <circle cx="214" cy="972" r="264" fill="#8af4d0" fill-opacity="0.12" />
  <g opacity="0.24">
    <path d="M120 896c149-73 308-110 474-110 129 0 281 26 474 82" fill="none" stroke="#fff0d7" stroke-width="18" stroke-linecap="round" />
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="944" rx="230" ry="48" fill="#000" fill-opacity="0.28" />
    <rect x="358" y="286" width="484" height="146" rx="73" fill="#fff1de" fill-opacity="0.94" />
    <rect x="318" y="374" width="564" height="438" rx="118" fill="url(#jar)" />
    <rect x="388" y="470" width="424" height="186" rx="92" fill="url(#label)" />
    <rect x="418" y="672" width="364" height="72" rx="36" fill="#fff7ea" fill-opacity="0.9" />
    <text x="600" y="542" text-anchor="middle" fill="#35200c" font-size="54" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="700" letter-spacing="10">ZEVLIN</text>
    <text x="600" y="610" text-anchor="middle" fill="#2c1707" font-size="106" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="800" letter-spacing="10">SUPER</text>
    <text x="600" y="684" text-anchor="middle" fill="#2c1707" font-size="98" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="800" letter-spacing="10">CRACK</text>
    <text x="600" y="714" text-anchor="middle" fill="#a65a0b" font-size="30" font-family="Arial, sans-serif" font-weight="700" letter-spacing="7">COOLING MINT RELIEF</text>
    <text x="600" y="786" text-anchor="middle" fill="#3f250f" font-size="34" font-family="Arial, sans-serif" font-weight="700" letter-spacing="8">CHAMOIS CREAM</text>
  </g>
  <text x="108" y="156" fill="#fff8ee" font-size="42" font-family="Arial, sans-serif" font-weight="700" letter-spacing="8">GOODS FOR YOUR GOODS</text>
  <text x="108" y="214" fill="#ead6bc" font-size="28" font-family="Arial, sans-serif" letter-spacing="6">MOCK STUDIO ART / LEGACY LINEUP</text>
</svg>
