<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">BYOT Fitness Wash mock art</title>
  <desc id="desc">Mock studio poster for BYOT Fitness Wash.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1717" />
      <stop offset="58%" stop-color="#13312a" />
      <stop offset="100%" stop-color="#235548" />
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eefcf4" />
      <stop offset="100%" stop-color="#ccefdc" />
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e4b1" />
      <stop offset="100%" stop-color="#baf7de" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#e3fff1" fill-opacity="0.16" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#020806" flood-opacity="0.36" />
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect width="1200" height="1200" fill="url(#dots)" />
  <circle cx="970" cy="200" r="228" fill="#9dfbcb" fill-opacity="0.18" />
  <circle cx="220" cy="994" r="284" fill="#f7c14b" fill-opacity="0.1" />
  <g opacity="0.24">
    <path d="M126 904c147-79 306-118 478-118 135 0 283 27 466 85" fill="none" stroke="#e9fff5" stroke-width="18" stroke-linecap="round" />
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="954" rx="188" ry="42" fill="#000" fill-opacity="0.28" />
    <rect x="516" y="224" width="168" height="82" rx="24" fill="#e9f8ee" />
    <rect x="652" y="214" width="104" height="28" rx="14" fill="#d4f4e0" />
    <rect x="734" y="218" width="54" height="20" rx="10" fill="#d4f4e0" />
    <rect x="404" y="294" width="392" height="584" rx="136" fill="url(#bottle)" />
    <rect x="452" y="420" width="296" height="248" rx="88" fill="url(#label)" />
    <rect x="454" y="692" width="292" height="94" rx="47" fill="#f3fff8" fill-opacity="0.92" />
    <text x="600" y="498" text-anchor="middle" fill="#17553f" font-size="86" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="800" letter-spacing="8">BYOT</text>
    <text x="600" y="566" text-anchor="middle" fill="#17553f" font-size="42" font-family="Arial, sans-serif" font-weight="700" letter-spacing="7">FITNESS WASH</text>
    <text x="600" y="750" text-anchor="middle" fill="#2d7057" font-size="28" font-family="Arial, sans-serif" font-weight="700" letter-spacing="6">POST-RIDE CLEANUP WITHOUT THE SHOWER</text>
  </g>
  <text x="108" y="156" fill="#f4fff8" font-size="42" font-family="Arial, sans-serif" font-weight="700" letter-spacing="8">GOODS FOR YOUR GOODS</text>
  <text x="108" y="214" fill="#c9ead8" font-size="28" font-family="Arial, sans-serif" letter-spacing="6">MOCK STUDIO ART / LEGACY LINEUP</text>
</svg>
